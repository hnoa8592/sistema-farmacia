version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: farmacia-postgres
    environment:
      POSTGRES_DB: farmacia_pos
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/01-init-public.sql:/docker-entrypoint-initdb.d/01-init-public.sql
    networks:
      - farmacia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d farmacia_pos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILE: dev
      DB_URL: jdbc:postgresql://postgres:5432/farmacia_pos
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: mySecretKeyForJWTThatIsLongEnoughToBeSecure1234567890
      JWT_EXPIRATION: "28800000"
      SERVER_PORT: "8080"
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - farmacia-network

volumes:
  postgres_data:

networks:
  farmacia-network:
    driver: bridge
